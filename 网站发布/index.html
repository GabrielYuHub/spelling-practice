<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="单词拼写">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2b6cb0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>单词拼写练习</title>
<style>
  :root {
    --blue: #2b6cb0;
    --blue-soft: #e1edf9;
    --key: #f5c518;
    --key-shadow: #d4a50a;
    --green: #4caf50;
    --orange: #f0a030;
    --btn-blue: #1e88e5;
    --text: #333;
    --fill: #e67e22;
    --red: #e53935;
    --bg: #f0f4f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #f7fafc 0%, var(--bg) 100%);
    color: var(--text);
    font-family: "Chalkboard SE", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overflow-x: hidden;
  }
  .app {
    max-width: 920px; margin: 0 auto; min-height: 100%;
    padding: max(16px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 {
    margin: 4px 0 0; color: var(--blue); font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 2px; text-shadow: 0 3px 6px rgba(43,108,176,.18);
  }
  .word-row { display: flex; align-items: center; gap: 12px; min-height: 90px; margin-top: 3vh; max-width: 100%; }
  .word {
    font-size: clamp(40px, 8vw, 76px); font-weight: bold; letter-spacing: .08em;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; line-height: 1.15; row-gap: 10px;
  }
  .word.long { font-size: clamp(30px, 5.2vw, 54px); }
  .word .wd { display: inline-flex; align-items: flex-end; white-space: nowrap; }
  .word .ch { display: inline-block; min-width: .3em; text-align: center; }
  .word .gap { width: .5em; }
  .word .slot {
    min-width: .85em; margin: 0 .06em; border-bottom: 6px solid var(--blue);
    color: var(--fill); cursor: pointer; border-radius: 2px;
  }
  .word .slot.next { border-bottom-color: var(--orange); animation: blink 1s steps(2) infinite; }
  .word .slot.filled { border-bottom-color: var(--blue); animation: none; }
  .word .slot.reveal { color: var(--green); }
  .word .slot.bad { color: var(--red); border-bottom-color: var(--red); }
  @keyframes blink { 50% { border-bottom-color: #bcd3ea; } }
  .word.shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-14px); }
    40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); }
  }
  .speak {
    width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--blue-soft);
    font-size: 28px; cursor: pointer; flex: none;
  }
  .speak:active { transform: scale(.92); }
  .cn { font-size: clamp(24px, 4vw, 34px); min-height: 1.2em; text-align: center; margin-bottom: 1vh; }
  .cn .pos { color: var(--blue); font-weight: bold; margin-right: 6px; font-family: "Chalkboard SE", "Comic Sans MS", sans-serif; }
  .cn .note { color: #888; font-size: .7em; margin-left: 8px; }

  .keyboard { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .krow { display: flex; justify-content: center; gap: 7px; }
  .key {
    flex: 0 0 calc((100% - 9 * 7px) / 10); height: 62px; border: none; border-radius: 12px;
    background: var(--key); color: #222; font: inherit; font-size: 28px; font-weight: bold;
    box-shadow: 0 4px 0 var(--key-shadow); cursor: pointer; padding: 0;
  }
  .key:active, .key.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-shadow); }
  .key.wide { flex-basis: calc((100% - 9 * 7px) / 10 * 1.5 + 3.5px); font-size: 24px; background: #ffe58a; }
  .key.shift.on { background: var(--orange); color: #fff; }

  .buttons { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .btn {
    border: none; border-radius: 14px; color: #fff; font: inherit; font-size: 22px;
    padding: 14px 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.12); min-width: 130px;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.submit { background: var(--green); }
  .btn.reset { background: var(--orange); }
  .btn.next { background: var(--btn-blue); }
  .btn.peek { background: #8e6bd8; }
  .btn.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(30,136,229,.25); } }

  .score { font-size: 22px; margin-top: auto; padding-top: 8px; text-align: center; }
  .score .sep { margin: 0 10px; color: #999; }
  .score small { display: block; font-size: 15px; color: #888; margin-top: 4px; }
  .loader-link { background: none; border: none; color: #888; font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }

  /* 覆盖层：烟花 / 错误 / 本轮结束 / 词库加载 */
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay.modal { background: rgba(20,40,70,.35); pointer-events: auto; }
  .feedback { font-size: 44px; font-weight: bold; text-align: center; animation: pop .35s ease-out; }
  .feedback .big { font-size: 120px; display: block; line-height: 1.1; }
  .feedback.good { color: var(--green); }
  .feedback.bad { color: var(--red); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .spark {
    position: fixed; left: 50%; top: 45%; font-size: 40px; pointer-events: none; z-index: 11;
    animation: burst 1.3s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }
  .panel {
    background: #fff; border-radius: 22px; padding: 30px 34px; text-align: center; max-width: 440px; width: calc(100% - 32px);
    box-shadow: 0 12px 40px rgba(0,0,0,.2); animation: pop .3s ease-out;
  }
  .panel h2 { margin: 0 0 12px; color: var(--blue); font-size: 30px; }
  .panel p { font-size: 20px; margin: 10px 0 20px; line-height: 1.6; }
  .panel .err { color: var(--red); font-size: 16px; }


  /* 顶部：孩子 / 标题 / 单词表 */
  /* 顶部一行可以比下面的内容宽（横屏 iPad 上用满屏幕宽度，按钮多了也放得下） */
  .header { width: min(100vw - 32px, 1200px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .header h1 { text-align: center; }
  .header #childChip { justify-self: start; }
  .header .right { justify-self: end; display: flex; gap: 8px; align-items: center; }
  .chip.tool { background: #fff; border: 1px solid #d6e2ee; }
  .chip {
    border: none; background: var(--blue-soft); color: var(--blue); font: inherit; font-size: 18px;
    border-radius: 999px; padding: 8px 16px; cursor: pointer; white-space: nowrap; max-width: 34vw;
    overflow: hidden; text-overflow: ellipsis; min-width: 44px;
  }
  .chip:active { transform: scale(.96); }
  .chip.note { background: #fff3e0; color: #b26a00; cursor: default; font-size: 14px; }
  .chip.placeholder { visibility: hidden; }

  .game { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 1; }

  /* 选择孩子 / 单词表 */
  .pick { width: 100%; max-width: 820px; text-align: center; margin-top: 3vh; }
  .pick h2 { color: var(--blue); font-size: 30px; margin: 0 0 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .cards-heading { grid-column: 1 / -1; text-align: left; color: #6b7a8c; font-size: 18px; margin: 10px 0 -6px; }
  .card.study { background: #fff; }
  /* 单词分组按钮：今日复习、学新词、错词本按分组分开练；红色数字是这个分组还没做的复习 */
  .group-pills { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: -4px; }
  .gpill { border: 1px solid #d6e2ee; background: #fff; color: var(--text); font: inherit; font-size: 19px; padding: 8px 20px; border-radius: 999px; cursor: pointer; }
  .gpill.on { background: #dbeafb; border-color: #9cc3ec; color: #1f5fa8; font-weight: bold; }
  .gbadge { display: inline-block; min-width: 22px; margin-left: 8px; padding: 0 6px; border-radius: 999px; background: #e53935; color: #fff; font-size: 14px; font-weight: bold; line-height: 22px; text-align: center; vertical-align: 2px; }
  /* 学习页面：学单词（单词组）和答题前的单词（今日复习、学新词、错词本）共用 */
  .study { width: 100%; max-width: 900px; }
  .study-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 4px 0 12px; }
  .sh-left { display: flex; gap: 8px; justify-self: start; flex-wrap: wrap; }
  .sh-title { text-align: center; }
  .sh-title h2 { margin: 0; color: var(--text); font-size: 28px; }
  .sh-sub { color: #888; font-size: 15px; }
  .sh-btn { border: 1px solid #d6e2ee; background: #fff; color: var(--blue); font: inherit; font-size: 17px; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .sh-btn.plain { border-color: transparent; background: none; padding-left: 4px; }
  .sh-btn.playing { background: #fff8e1; border-color: #f0c36d; color: #8a5a00; }
  .sh-btn.paused { background: #e8f5e9; border-color: #a5d6a7; color: #1e7a2e; }
  .sh-right { display: flex; gap: 8px; align-items: center; justify-self: end; }
  .sh-btn[hidden] { display: none; }
  .seg { display: inline-flex; gap: 4px; justify-self: end; }
  .seg button { border: 1px solid transparent; background: none; font: inherit; font-size: 17px; padding: 6px 16px; border-radius: 999px; cursor: pointer; color: #555; }
  .seg button.on { border-color: #c9d3de; background: #fff; color: var(--text); }
  .unit-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .unit-bar[hidden] { display: none; }
  .unit-bar button { border: 1px solid #d9e0e8; background: #fff; font: inherit; font-size: 17px; padding: 4px 16px; border-radius: 999px; cursor: pointer; color: var(--text); }
  .unit-bar button.on { border-color: #cfe2f7; background: #dbeafb; color: #1f5fa8; }
  .study-start { text-align: center; margin: 0 0 12px; }
  .study-start .btn { font-size: 24px; padding: 12px 44px; }
  .slist { list-style: none; margin: 0 0 18px; padding: 4px 20px; background: #fff; border: 1px solid #e3e8ef; border-radius: 18px; }
  .slist li { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid #e8edf3; }
  .slist li:first-child { border-top: none; }
  .slist li.reading { background: #fff8e1; border-radius: 10px; }
  .spk { width: 40px; height: 40px; border: none; background: none; color: #1f5fa8; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .spk svg { width: 28px; height: 28px; }
  .sline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sen { font-size: 26px; font-weight: bold; }
  .scn { font-size: 18px; color: #555; }
  .sex { font-size: 16px; color: #666; margin-top: 2px; }
  .sex span { margin-left: 6px; }
  .pill { font-size: 15px; border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
  .pill.m { background: #d9f2dc; color: #1e7a2e; }
  .pill.d { background: #dbeafb; color: #1f5fa8; }
  .pill.w { background: #fde2e1; color: #b3261e; }
  .pill.n { background: #e9e4fb; color: #5a3fb0; }
  .pill.o { background: #eef1f4; color: #5f6b78; }
  /* 翻卡片：上一个、下一个在卡片两边 */
  .flash-wrap { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .nav-btn { flex: none; width: 64px; height: 64px; border-radius: 50%; border: none; background: #fff; color: var(--blue); cursor: pointer;
    box-shadow: 0 4px 14px rgba(43,108,176,.18), inset 0 0 0 2px #dbe7f5; display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .15s; }
  .nav-btn svg { width: 30px; height: 30px; }
  .nav-btn:hover { box-shadow: 0 6px 18px rgba(43,108,176,.28), inset 0 0 0 2px #b9d3ef; }
  .nav-btn:active { transform: scale(.92); background: #eef5fd; }
  /* 卡片：正面蓝底白字，背面白底；点一下左右翻面（3D），换卡片时从一边滑进来 */
  .flash { flex: 1; max-width: 560px; perspective: 1400px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .fc-in { display: grid; min-height: 300px; transition: transform .5s cubic-bezier(.3,.7,.3,1.25); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
  .flash.flipped .fc-in { transform: rotateY(180deg); }
  .fc-face { grid-area: 1 / 1; border-radius: 24px; padding: 26px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .fc-face.front { background: var(--blue); color: #fff; box-shadow: 0 10px 24px rgba(43,108,176,.3); }
  .fc-face.back, .fc-face.plain { background: #fff; border: 2px solid #b5d4f4; box-shadow: 0 8px 22px rgba(0,0,0,.08); }
  .fc-face.back { transform: rotateY(180deg); }
  .flash .count { color: #999; font-size: 15px; margin-bottom: 8px; }
  .flash .big { font-size: 52px; font-weight: bold; line-height: 1.2; overflow-wrap: anywhere; color: #0c447c; }
  .flash .cnbig { font-size: 34px; color: #1f5fa8; }
  .flash .ex { font-size: 19px; color: #0c447c; background: var(--blue-soft); border-radius: 14px; padding: 10px 16px; margin-top: 14px; }
  .flash .ex span { display: block; color: #185fa5; font-size: 16px; }
  .flash .hint { color: #aaa; font-size: 15px; margin-top: 16px; }
  .flash .spk { margin-top: 8px; width: 52px; height: 52px; border-radius: 50%; background: var(--blue-soft); }
  .flash .front .count { color: rgba(255,255,255,.7); }
  .flash .front .big, .flash .front .cnbig { color: #fff; }
  .flash .front .hint { color: #cfe0f3; }
  .flash .front .spk { background: rgba(255,255,255,.2); color: #fff; }
  @keyframes fcInR { from { transform: translateX(48px); opacity: 0; } }
  @keyframes fcInL { from { transform: translateX(-48px); opacity: 0; } }
  .flash.in-r { animation: fcInR .25s ease-out; }
  .flash.in-l { animation: fcInL .25s ease-out; }
  @media (prefers-reduced-motion: reduce) { .fc-in { transition: none; } .flash.in-r, .flash.in-l { animation: none; } }
  .flash-ctrl { display: flex; justify-content: center; margin-top: 14px; }
  @media (max-width: 640px) {
    .study-head { display: flex; flex-wrap: wrap; gap: 8px; }
    .sh-title { width: 100%; order: -1; }
    .sh-right { margin-left: auto; }
    .sh-title h2 { font-size: 24px; }
    .sh-btn { font-size: 16px; padding: 6px 10px; }
    .sh-btn.plain { padding-left: 2px; }
    .seg button { padding: 6px 12px; }
    .slist { padding: 4px 12px; }
    .slist li { grid-template-columns: 40px 1fr; }
    .slist .pill { grid-column: 2; justify-self: start; }
    .nav-btn { width: 48px; height: 48px; }
    .flash-wrap { gap: 8px; }
    .flash .big { font-size: 40px; }
  }
  .card {
    border: none; background: #fff; border-radius: 20px; padding: 26px 16px; cursor: pointer; font: inherit;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); color: var(--text); position: relative;
  }
  .card:active { transform: scale(.97); }
  .card .icon { font-size: 52px; display: block; margin-bottom: 8px; }
  .card .name { font-size: 26px; font-weight: bold; display: block; }
  .card .sub { font-size: 16px; color: #888; margin-top: 6px; display: block; }
  .card.last { outline: 3px solid var(--orange); }
  /* “你是谁？”卡片上的进度 */
  .prog { display: block; margin-top: 10px; font-size: 15px; color: #666; min-height: 64px; }
  .prog .ptxt { display: block; font-weight: bold; color: var(--text); }
  .prog .pbar { display: block; height: 8px; background: #eef2f6; border-radius: 999px; overflow: hidden; margin: 6px 12px; }
  .prog .pbar i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 999px; transition: width .4s; }
  .prog.done .ptxt { color: #2e7d32; }
  .prog.done .pbar i { background: #43a047; }
  .prog .pmeta { display: block; font-size: 14px; }
  .card .badge {
    position: absolute; top: 10px; right: 10px; background: var(--orange); color: #fff;
    font-size: 13px; border-radius: 999px; padding: 2px 10px;
  }
  .pick-msg { color: var(--red); font-size: 18px; min-height: 1.4em; }
  .retry-btn { border: none; background: var(--blue-soft); color: var(--blue); font: inherit; font-size: 17px; padding: 6px 18px; border-radius: 999px; cursor: pointer; margin: -4px 0 8px; }
  /* 离线提示条 */
  .offline-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30; text-align: center; font-size: 15px; line-height: 28px;
    background: #fff3cd; color: #7a5b00; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-family: "PingFang SC", sans-serif;
  }
  body.is-offline { padding-top: 28px; }
  /* 管理员入口：低调的小按钮，避免小朋友误点（进入后仍需管理密码） */
  .admin-link {
    display: inline-block; margin-top: 26px; padding: 7px 18px; border-radius: 999px; border: 1px solid #d6e2ee;
    background: #fff; color: #8a97a5; font-size: 15px; text-decoration: none;
  }
  .admin-link:active { background: #eef2f6; }
  .foot-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .foot-links[hidden] { display: none; }
  .pin-admin { display: inline-block; margin-top: 16px; color: #9aa4ae; font-size: 14px; text-decoration: none; }
  .pick-msg.good { color: var(--green); }
  .card:disabled { opacity: .5; cursor: default; transform: none; }
  .card.review { background: #e8f3ff; }
  .card.wrong { background: #fdeeee; }
  .card.new { background: #f3f0ff; }
  /* 每日打卡 */
  .checkin {
    display: flex; align-items: center; gap: 14px; width: min(560px, 100%); margin: -6px auto 14px; padding: 10px 16px;
    background: #fff; border: none; border-radius: 16px; box-shadow: 0 3px 12px rgba(0,0,0,.08); cursor: pointer; font: inherit; color: var(--text);
  }
  .checkin .track { flex: 1; height: 14px; background: #eef2f6; border-radius: 999px; overflow: hidden; }
  .checkin .fill { height: 100%; background: var(--orange); border-radius: 999px; transition: width .4s; }
  .checkin.done .fill { background: var(--green); }
  .checkin .today { font-size: 18px; white-space: nowrap; }
  .checkin .streak { font-size: 18px; white-space: nowrap; color: #d84315; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; margin: 8px 0 18px; }
  .badge-item { background: #fff8e1; border-radius: 14px; padding: 10px 6px; font-size: 14px; color: #7a5c00; }
  .badge-item b { display: block; font-size: 34px; line-height: 1.2; }
  .badge-item.off { background: #f1f3f5; color: #9aa4ae; filter: grayscale(1); opacity: .6; }
  .badge-summary { font-size: 17px; color: #555; margin: 0 0 6px; line-height: 1.7; }
  .panel.wide { max-width: 560px; }
  .panel h3 { font-size: 18px; color: var(--blue); margin: 10px 0 0; text-align: left; }
  .review-banner {
    background: #fff7e0; color: #9a6400; border-radius: 14px; padding: 10px 18px; font-size: 20px;
    margin: -8px auto 18px; display: inline-block;
  }
  .levels { display: inline-flex; background: #e6edf5; border-radius: 999px; padding: 4px; gap: 4px; margin: -6px 0 20px; }
  .levels button {
    border: none; background: none; font: inherit; font-size: 18px; padding: 8px 18px; border-radius: 999px;
    cursor: pointer; color: #555;
  }
  .levels button.on { background: #fff; color: var(--blue); font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .groups { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 18px; }
  .groups button {

<script>
(() => {
  'use strict';

  // ---------- 工具 ----------
  const $ = id => document.getElementById(id);
  const rand = n => Math.floor(Math.random() * n);
  const pick = arr => arr[rand(arr.length)];
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) { const j = rand(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  };
  const isLetter = c => /^[A-Za-z]$/.test(c);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const show = (id, on) => { $(id).hidden = !on; };
  const overlay = (id, on) => $(id).classList.toggle('show', on);

  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ---------- 接口 ----------
  const API = 'api/app';
  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  // 读取数据（GET）遇到超时或网络中断时自动再试一次；提交（POST）不自动重试，避免重复计数
  async function api(method, query, body, opts = {}) {
    try {
      return await apiOnce(method, query, body, opts);
    } catch (e) {
      if (e instanceof ApiError || method !== 'GET') throw e;
      await new Promise(res => setTimeout(res, 800));
      return apiOnce(method, query, body, opts);
    }
  }
  async function apiOnce(method, query, body, opts) {
    const ctrl = new AbortController();
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, opts.timeout || 15000);
    try {
      const r = await fetch(API + (query || ''), {
        method,
        cache: 'no-store',
        headers: body ? { 'content-type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
        signal: ctrl.signal,
        keepalive: !!opts.keepalive,
      });
      let d = null;
      try { d = await r.json(); } catch (e) {}
      if (!r.ok) throw new ApiError(r.status, (d && d.error) || ('服务器错误 ' + r.status));
      return d;
    } catch (e) {
      // 浏览器的原始提示是英文（如 Safari 的 “signal is aborted without reason”），换成中文
      if (e instanceof ApiError) throw e;
      throw new Error(timedOut ? '网络有点慢，等了 ' + Math.round((opts.timeout || 15000) / 1000) + ' 秒没有回应' : '网络连接中断了');
    } finally {
      clearTimeout(timer);
    }
  }

  // ---------- 挖空规则：见 wordlib.js（WordLib.blanksFor，有自动化测试） ----------

  // 难度：easy 简单（上面的规则）/ medium 进阶（挖一半字母）/ dictation 听写（全部字母）
  // auto 自动：按熟练度决定——还不熟用简单，答对 2 次以上且最近没错用进阶，答对 4 次以上用听写
  const LEVELS = [['auto', '自动'], ['easy', '简单'], ['medium', '进阶'], ['dictation', '听写']];
  const levelName = id => (LEVELS.find(l => l[0] === id) || LEVELS[0])[1];

  // ---------- 音效（Web Audio 合成） ----------
  let actx = null;
  function audio() {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, start, dur, type = 'triangle', vol = 0.25, endFreq) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const playSuccess = () => {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.25));
    tone(1319, 0.42, 0.45, 'triangle', 0.2);
    tone(1568, 0.5, 0.5, 'sine', 0.12);
  };
  const playWrong = () => {
    tone(330, 0, 0.22, 'square', 0.12, 260);
    tone(220, 0.24, 0.4, 'square', 0.12, 150);
  };
  const playKey = () => tone(880, 0, 0.05, 'sine', 0.05);
  // iOS 需要在用户首次触摸时解锁音频：音效、设备自带朗读、录音播放器各解锁一次
  document.addEventListener('pointerdown', () => {
    audio();
    if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
    if (!clipBusy()) { player.src = SILENT_WAV; player.play().catch(() => {}); }
  }, { once: true });

  // ---------- 朗读 ----------
  // 先用录音（有道词典的发音：单词全有，短语和句子只有一部分）；没有录音时用设备自带朗读。
  // 录音由云函数去有道取，存在云数据库里；每台设备第一次取到后再存一份在本机（Cache Storage），以后没网也能播。
  // 设备自带朗读避开 Safari 的几个毛病：停掉上一句马上读新的，新的一句会被吞掉；切到后台再回来会卡在暂停；
  // 朗读对象被回收后读完不回调；偶尔一直不出声
  // 调试：网址加 ?debug 时，屏幕左下角显示朗读的每一步（录音还是自带朗读、用了哪个声音、语速、开始、结束、出错、重读）
  const SPEECH_DEBUG = /[?&]debug\b/.test(location.search);
  const dlog = (...a) => {
    if (!SPEECH_DEBUG) return;
    let box = document.getElementById('speechDebug');
    if (!box) {
      box = document.createElement('pre');
      box.id = 'speechDebug';
      box.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:9999;max-width:min(560px,calc(100vw - 12px));max-height:40vh;overflow:hidden;margin:0;padding:6px 8px;'
        + 'background:rgba(0,0,0,.78);color:#9f9;font:11px/1.35 Menlo,monospace;white-space:pre-wrap;border-radius:6px;pointer-events:none';
      document.body.appendChild(box);
    }
    const t = new Date(), ts = t.toTimeString().slice(3, 8) + '.' + String(t.getMilliseconds()).padStart(3, '0');
    box.textContent = (box.textContent + '\n' + ts + ' ' + a.join(' ')).split('\n').slice(-16).join('\n').trim();
  };
  const isOnline = () => navigator.onLine !== false && !S.offline;

  // ----- 录音 -----
  const SILENT_WAV = 'data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
  const player = new Audio();
  player.preload = 'auto';
  const clipBusy = () => !player.paused && !player.ended && player.src !== SILENT_WAV;
  const CLIP_CACHE = 'spell-audio-v1', CLIP_NONE_DAYS = 14; // 没有录音的，14 天后再问服务器
  const clipMem = new Map();      // 文字 → 播放地址（blob:）或 ''（没有录音）
  const clipPending = new Map();  // 正在取的，避免同一句同时取两次
  const clipKey = text => new Request(location.origin + '/__clip__?t=' + encodeURIComponent(text));
  async function clipStore() { try { return 'caches' in window ? await caches.open(CLIP_CACHE) : null; } catch (e) { return null; } }
  function b64Blob(b64) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'audio/mpeg' });
  }
  // 取一句的录音：返回播放地址；'' 表示有道没有这句；null 表示暂时拿不到（没网、超时），这次先用自带朗读
  function getClip(text, timeout) {
    if (clipMem.has(text)) return Promise.resolve(clipMem.get(text));
    if (clipPending.has(text)) return clipPending.get(text);
    const p = (async () => {
      const store = await clipStore();
      const hit = store && await store.match(clipKey(text)).catch(() => null);
      if (hit) {
        if (hit.headers.get('x-none')) {
          if (Date.now() - Number(hit.headers.get('x-time') || 0) < CLIP_NONE_DAYS * 86400000) { clipMem.set(text, ''); return ''; }
        } else {
          const url = URL.createObjectURL(await hit.blob());
          clipMem.set(text, url);
          return url;
        }
      }
      if (!isOnline()) return null;
      let d;
      try { d = await apiOnce('GET', '?op=audio&t=' + encodeURIComponent(text), null, { timeout: timeout || 8000 }); } catch (e) { return null; }
      if (!d || d.retry) return null;
      if (!d.audio) {
        if (store) store.put(clipKey(text), new Response('', { headers: { 'x-none': '1', 'x-time': String(Date.now()) } })).catch(() => {});
        clipMem.set(text, '');
        return '';
      }
      const blob = b64Blob(d.audio);
      if (store) store.put(clipKey(text), new Response(blob, { headers: { 'content-type': 'audio/mpeg' } })).catch(() => {});
      const url = URL.createObjectURL(blob);
      clipMem.set(text, url);
      return url;
    })().finally(() => clipPending.delete(text));
    clipPending.set(text, p);
    return p;
  }
  // 进入学习页面或开始一轮时，先在后台把这些单词和例句的录音取好（每次最多同时取 2 个），读的时候就不用等
  let prefetchToken = 0;
  function prefetchClips(words) {
    if (!isOnline()) return;
    const texts = [...new Set(words.flatMap(w => [w.en, w.ex]).filter(Boolean).map(WordLib.sayText))].filter(t => t && !clipMem.has(t));
    const token = ++prefetchToken;
    let i = 0;
    const next = () => { if (token === prefetchToken && i < texts.length) getClip(texts[i++]).then(next, next); };
    next(); next();
  }

  // ----- 设备自带朗读 -----
  let voice = null;
  const loadVoice = () => {
    const vs = speechSynthesis.getVoices(), v = WordLib.pickVoice(vs, isOnline());
    if (v !== voice) dlog('声音列表', vs.length, '个，用', v ? v.name + ' ' + v.lang + ' ' + (v.voiceURI || '') : '（默认 en-US）');
    voice = v;
  };
  if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoice; }

  let cur = null, lastCancel = 0;   // cur：正在读的一句 { onEnd, timers, tries, done }
  // 这一句结束（读完、出错、超时或被新的一句打断），onEnd 只调用一次
  function endSpeak(c) {
    if (!c || c.done) return;
    c.done = true;
    c.timers.forEach(clearTimeout);
    if (cur === c) cur = null;
    if (c.onEnd) c.onEnd();
  }
  function stopSpeak() {
    endSpeak(cur);
    player.onended = player.onerror = null;
    if (clipBusy()) player.pause();
    if ('speechSynthesis' in window) { speechSynthesis.cancel(); lastCancel = Date.now(); }
  }
  // 朗读时暂停网页的音效通道（按键声、答对声），避免和朗读抢声音；放音效时会自动打开
  function quietEffects() { if (actx && actx.state === 'running') { actx.suspend().catch(() => {}); dlog('暂停音效通道'); } }
  // text：要读的内容；ttsText：没有录音、用自带朗读时读的文字（一词多音的纠正过）；onEnd：读完（或出错、放弃）时调用
  function speak(text, onEnd, ttsText) {
    const say = WordLib.sayText(text);
    if (!say) { if (onEnd) onEnd(); return; }
    if (cur || clipBusy() || ('speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending))) stopSpeak();
    const c = cur = { onEnd, timers: [], tries: 0, done: false };
    // 本机已有的立即播；要去服务器取的最多等 2.5 秒，来不及就这次先用自带朗读（后台接着取，下次就有了）
    let settled = false;
    const go = url => {
      if (settled || c.done) return;
      settled = true;
      if (url) playClip(c, url, say, ttsText || say);
      else { dlog(url === '' ? '没有录音：' : '录音没取到：', say.slice(0, 40)); ttsSpeak(c, ttsText || say); }
    };
    getClip(say).then(go, () => go(null));
    c.timers.push(setTimeout(() => go(null), 2500));
  }
  function playClip(c, url, say, ttsText) {
    const rate = Math.min(2, Math.max(0.5, speechRate()));
    quietEffects();
    let fell = false;
    const fallback = why => { if (fell || c.done) return; fell = true; dlog('录音放不了（' + why + '），改用自带朗读'); player.onended = player.onerror = null; ttsSpeak(c, ttsText); };
    player.onended = () => { dlog('录音读完'); endSpeak(c); };
    player.onerror = () => fallback('出错');
    player.src = url;
    player.preservesPitch = player.webkitPreservesPitch = true; // 放慢时不变调
    player.defaultPlaybackRate = player.playbackRate = rate;
    dlog('录音：' + say.slice(0, 40), '速度', rate);
    player.play().then(() => {
      if (c.done) return;
      // 保险：录音读完没有回调时，按长度估一个最长时间
      const secs = isFinite(player.duration) && player.duration > 0 ? player.duration : 8;
      c.timers.push(setTimeout(() => endSpeak(c), (secs / rate) * 1000 + 1500));
    }, e => fallback(e && e.name));
  }
  function ttsSpeak(c, say) {
    if (!('speechSynthesis' in window)) { endSpeak(c); return; }
    loadVoice();
    const start = () => {
      if (c.done) return;
      c.tries++;
      const u = new SpeechSynthesisUtterance(say);
      c.u = u; // 留着引用，防止被回收后读完不回调
      u.lang = voice ? voice.lang.replace('_', '-') : 'en-US';
      u.rate = speechRate() * 0.8; // 自带朗读比录音快，按同一档再乘 0.8
      if (voice) try { u.voice = voice; } catch (e) { dlog('设置声音失败', e.message); }
      let started = false;
      // 开始出声后，按长度估一个最长时间，到了还没回调就当读完
      const markStarted = why => {
        if (started) return;
        started = true;
        dlog(why);
        c.timers.push(setTimeout(() => { dlog('超时，当作读完'); endSpeak(c); }, 3000 + say.length * 120 / u.rate));
      };
      u.onstart = () => markStarted('开始出声');
      u.onend = () => { dlog('读完'); if (c.u === u) endSpeak(c); };
      u.onerror = e => { dlog('出错', e && e.error); if (c.u === u && started) endSpeak(c); };
      quietEffects();
      speechSynthesis.resume();
      speechSynthesis.speak(u);
      dlog('自带朗读：' + say.slice(0, 40), '语速', Math.round(u.rate * 100) / 100, voice ? voice.name : '默认', '第', c.tries, '次');
      // 1.5 秒还没报告出声：iPad 说正在读就相信它，不打断；说没在读才停掉重读一次，还不行就放弃
      c.timers.push(setTimeout(() => {
        if (c.done || started) return;
        if (speechSynthesis.speaking) { markStarted('没报告开始，但正在读，不打断'); return; }
        if (c.tries >= 2) { dlog('还是没读，放弃'); endSpeak(c); return; }
        dlog('1.5 秒没读，重读');
        c.u = null;
        speechSynthesis.cancel();
        lastCancel = Date.now();
        c.timers.push(setTimeout(start, 150));
      }, 1500));
    };
    // 刚停掉上一句时隔一会儿再读，否则新的一句可能被吞掉或开头被切掉
    const wait = 150 - (Date.now() - lastCancel);
    if (wait > 0) c.timers.push(setTimeout(start, wait)); else start();
  }
  // 语速：慢 / 中 / 快三档，数值是孩子的设置（管理页，播放速度，1 = 录音原速）；选哪一档按孩子记在这台设备上
  const RATE_KEYS = ['slow', 'mid', 'fast'], RATE_LABEL = ['🐢 慢速', '🚶 中速', '🐇 快速'], DEFAULT_RATES = [0.7, 0.85, 1];
  const rateKey = () => 'spell_rate_' + (S.session ? S.session.child : '');
  function rateIdx() { const i = RATE_KEYS.indexOf(ls.get(rateKey(), 'mid')); return i < 0 ? 1 : i; }
  function speechRate() {
    const c = myChild(), r = c && Array.isArray(c.rates) && c.rates.length === 3 ? c.rates : DEFAULT_RATES;
    return Number(r[rateIdx()]) || DEFAULT_RATES[1];
  }
  function updateRate() { $('rateChip').textContent = $('studyRate').textContent = RATE_LABEL[rateIdx()]; }
  function cycleRate() { ls.set(rateKey(), RATE_KEYS[(rateIdx() + 1) % 3]); updateRate(); }
  // 读一个单词：有录音就放录音；用自带朗读时，一词多音的按词性纠正
  const speakWord = (w, onEnd) => speak(w.en, onEnd, WordLib.sayWord(w));

  // ---------- 状态 ----------
  const S = {
    online: false,
    config: null,        // { children:[{id,name}], lists:[{id,name,roundSize,count}] }
    session: null,       // { child, pin, name }
    list: null,          // 当前单词表
    words: [],
    stats: {},           // 熟练度与复习计划 { en: { score, wrong, right, lastWrong, lvl, due, mastered } }
    pool: [],            // 所有单词表里的单词（去重），用于错词本和今日复习
    days: {},            // 每日答对题数 { 'YYYY-MM-DD': n }（北京时间），用于打卡
    justCheckedIn: false,
    level: ls.get('spell_level', 'auto'),        // 选择的难度
    autoSpeak: ls.get('spell_autospeak', true),  // 自动朗读
    lv: 'easy',          // 当前这道题实际使用的难度
    queue: [],           // 本轮待出题（words 下标）
    round: null,         // 本轮记录
    cur: -1,
    blanks: [],          // 挖空位置
    filled: [],          // 已填字母（与 blanks 对应）
    wrongThisWord: false,
    solved: false,       // 当前题是否已答对
    skipped: false,      // （已不再使用：不能跳过）
    tries: 0,            // 当前题已经答错的次数
    revealed: false,     // 当前题是否已经显示了正确答案（答错太多或点了“看答案”）
    badSlots: new Set(), // 上次提交时答错的空（下标），标红
    busy: false,
    shift: false,
    correct: 0, wrong: 0,
  };

  // ---------- 出题 ----------
  const score = i => ((S.stats[S.words[i].en] || {}).score) || 0;

  // 一轮：词数不超过每轮题数时全出；否则按熟练度加权抽取（错得多的更容易被抽到）
  // 熟练度分数 ≥4 的词在一轮里出现 2 次，≥8 出现 3 次
  // 学新词：按孩子的“每天题量”和“每天新词上限”算今天学几个、学哪几个（规则见 wordlib.js）
  // 按单词分组：从这个分组挑新词；每天学几个按所有分组合计；“先完成今日复习”只看这个分组
  function newPlan(g = curGroup()) {
    const c = S.session && S.config && S.config.children.find(x => x.id === S.session.child);
    return WordLib.planNewWords(S.pool, S.stats, { target: (c && c.daily) || 30, cap: c && c.newCap != null ? c.newCap : 5, scope: poolOf(g) });
  }
  const NEW_STATUS = {
    ready: n => '今天学 ' + n + ' 个新词',
    'review-first': () => '先完成今日复习',
    'today-done': () => '今天的新词学完啦 🎉',
    'review-only': () => '今天复习已够量，只复习',
    'all-done': () => '这组的新词都学完啦',
    paused: () => '暂停学新词',
  };
  const myChild = () => S.session && S.config && S.config.children.find(x => x.id === S.session.child);
  // 每轮题数：孩子的设置（管理页“孩子”里设置，所有单词表通用），默认 20
  function roundOf() {
    const c = S.session && S.config && S.config.children.find(x => x.id === S.session.child);
    return (c && c.round) || 20;
  }
  function buildQueue() {
    const size = roundOf();
    let idx = S.words.map((_, i) => i);
    if (idx.length > size) {
      const pool = idx, chosen = [];
      while (chosen.length < size) {
        const weights = pool.map(i => 1 + score(i) * 2);
        let r = Math.random() * weights.reduce((a, b) => a + b, 0);
        let k = 0;
        for (; k < weights.length - 1; k++) { r -= weights[k]; if (r < 0) break; }
        chosen.push(pool.splice(k, 1)[0]);
      }
      idx = chosen;
    }
    const queue = shuffle(idx.slice());
    idx.forEach(i => {
      const s = score(i);
      const extra = s >= 8 ? 2 : s >= 4 ? 1 : 0;
      for (let e = 0; e < extra; e++) {
        const from = Math.min(queue.length, queue.lastIndexOf(i) + 4);
        queue.splice(from + rand(queue.length - from + 1), 0, i);
      }
    });
    return queue;
  }

  function newRecordId(listId) {
    const ts = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15); // YYYYMMDDTHHMMSS
    return ts + '_' + listId + '_' + Math.random().toString(36).slice(2, 8).padEnd(6, '0');
  }

  function startRound() {
    overlay('roundOverlay', false);
    S.queue = buildQueue();
    const now = Date.now();
    S.round = {
      id: newRecordId(S.list.id), group: S.list.group || '', start: now, lastActive: now, planned: S.queue.length,
      events: [], sent: 0, seq: 0, lastStatus: '', correct: 0, wrong: 0, wrongWords: {}, skipped: [], done: false,
    };
    S.cur = -1;
    prefetchClips(S.words);
    nextWord();
  }

  // 离开当前题时：本题答错过 → 隔 3~5 题再考一次；没答对就跳过 → 记为跳过
  function leaveCurrent() {
    if (S.cur < 0) return;
    if (S.skipped && S.round) S.round.skipped.push(S.words[S.cur].en);
    if (!S.wrongThisWord) return;
    const idx = S.queue.indexOf(S.cur);
    if (idx >= 0) S.queue.splice(idx, 1);
    const pos = Math.min(S.queue.length, 3 + rand(3));
    S.queue.splice(pos, 0, S.cur);
  }

  function showExample(w) {
    const i = w.ex.toLowerCase().indexOf(w.en.toLowerCase());
    const html = i < 0 ? esc(w.ex)
      : esc(w.ex.slice(0, i)) + '<mark>' + esc(w.ex.slice(i, i + w.en.length)) + '</mark>' + esc(w.ex.slice(i + w.en.length));
    const box = $('example'), cn = $('cn');
    box.innerHTML = html + (w.exCn ? '<small>' + esc(w.exCn) + '</small>' : '');
    box.style.top = (cn.offsetTop + cn.offsetHeight + 8) + 'px';
    show('example', true);
  }

  function nextWord() {
    if (S.advTimer) { clearTimeout(S.advTimer); S.advTimer = null; }
    stopSpeak(); // 例句还没读完就换题时停止朗读
    show('example', false);
    leaveCurrent();
    if (!S.queue.length) { S.cur = -1; showRoundEnd(); return; }
    S.cur = S.queue.shift();
    const w = S.words[S.cur];
    S.lv = levelOf(w);
    const kid = myChild();
    S.blanks = WordLib.blanksFor(w.en, S.lv, w.fixed, kid && kid.maxBlanks);
    S.badSlots = new Set(); // 上次提交时答错的空（标红，孩子点一下就能改）
    S.filled = S.blanks.map(() => null);
    S.wrongThisWord = false;
    S.solved = false;
    S.skipped = false;
    S.tries = 0;
    S.revealed = false;
    show('peekBtn', false);
    $('nextBtn').classList.remove('pulse');
    S.busy = false;
    setShift(false);
    $('cn').innerHTML = (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '') + esc(w.cn)
      + (w.note ? '<span class="note">' + esc(w.note) + '</span>' : '');
    renderWord();
    updateScore();
    updateLevelChip();
    if (S.autoSpeak || S.lv === 'dictation') setTimeout(() => { if (S.words[S.cur] === w) speakWord(w); }, 350);
  }

  function levelOf(w) {
    if (S.level !== 'auto') return S.level;
    const c = myChild();
    return WordLib.autoLevel(S.stats[w.en], { med: c && c.lvMed, dict: c && c.lvDict });
  }

  function renderWord(reveal = false) {
    const w = S.words[S.cur].en;
    const box = $('word');
    box.innerHTML = '';
    box.classList.toggle('long', w.length > 14);
    const nextSlot = S.filled.indexOf(null);
    let group = null;
    [...w].forEach((c, i) => {
      if (c !== ' ' && !group) { group = document.createElement('span'); group.className = 'wd'; box.appendChild(group); }
      const span = document.createElement('span');
      const b = S.blanks.indexOf(i);
      if (b >= 0) {
        span.className = 'ch slot';
        const val = reveal ? c : S.filled[b];
        if (val) { span.textContent = val; span.classList.add('filled'); if (reveal) span.classList.add('reveal'); else if (S.badSlots && S.badSlots.has(b)) span.classList.add('bad'); }
        else { span.innerHTML = '&nbsp;'; if (b === nextSlot) span.classList.add('next'); }
        span.addEventListener('click', () => clearSlot(b));
      } else if (c === ' ') {
        span.className = 'ch gap';
        group = null;
        box.appendChild(span);
        return;
      } else {
        span.className = 'ch';
        span.textContent = c;
      }
      group.appendChild(span);
    });
    $('submitBtn').disabled = S.busy || S.filled.includes(null);
  }

  function updateScore() {
    $('correct').textContent = S.correct;
    $('wrong').textContent = S.wrong;
    $('left').textContent = S.queue.length + (S.cur >= 0 ? 1 : 0);
  }

  // ---------- 输入 ----------
  function typeLetter(ch) {
    if (S.busy || S.cur < 0) return;
    const i = S.filled.indexOf(null);
    if (i < 0) return;
    S.filled[i] = ch;
    playKey();
    if (S.shift) setShift(false);
    renderWord();
  }
  function backspace() {
    if (S.busy || S.cur < 0) return;
    for (let i = S.filled.length - 1; i >= 0; i--) {
      if (S.filled[i]) { S.filled[i] = null; S.badSlots.delete(i); break; }
    }
    renderWord();
  }
  function clearSlot(b) {
    if (S.busy || !S.filled[b]) return;
    S.filled[b] = null;
    S.badSlots.delete(b);
    renderWord();
  }
  function resetWord() {
    if (S.busy || S.cur < 0) return;
    S.filled = S.blanks.map(() => null);
    S.badSlots.clear();
    renderWord();
  }

  // 显示正确答案（绿色）并朗读，键盘暂停输入，等小朋友按“下一个单词”
  // 两种情况：答错达到最多尝试次数；或者答错过以后自己点了“👀 看答案”
  function revealAnswer(title) {
    const w = S.words[S.cur];
    S.revealed = true;
    S.busy = true;
    show('peekBtn', false);
    renderWord(true);
    if (S.autoSpeak || S.lv === 'dictation') speakWord(w);
    showFeedback('bad', '💡', title + '<br><small style="font-size:.6em">记住它，然后按“下一个单词”</small>');
    setTimeout(() => { if (S.revealed) hideFeedback(); $('word').classList.remove('shake'); }, 1800);
    $('nextBtn').classList.add('pulse');
  }

  // ---------- 判题 ----------
  // noScore：同一道题第 3 次及以后的答错，只记次数、不再加熟练度分数（每题最多 +4）
  // noScore：本题第 3 次及以后的答错（不再加分）；repeat：本题第 2 次及以后的答错（不再退级）
  function recordAnswer(en, ok, noScore, repeat) {
    const r = S.round;
    const at = new Date().toISOString();
    const ev = { en, ok, at };
    if (noScore) ev.ns = true;
    if (repeat) ev.rp = true;
    r.events.push(ev);
    r.lastActive = Date.now();
    if (ok) r.correct++;
    else { r.wrong++; r.wrongWords[en] = (r.wrongWords[en] || 0) + 1; }
    // 本地同步更新熟练度和复习计划（规则与服务器相同，见 wordlib.js），下一轮马上生效
    WordLib.applyAnswer(S.stats[en] || (S.stats[en] = { score: 0, wrong: 0, right: 0 }), ok, at, noScore, repeat);
    if (ok && S.online && S.session) {
      const today = WordLib.bjDate(at);
      S.days[today] = (S.days[today] || 0) + 1;
      if (S.days[today] === goalOf()) S.justCheckedIn = true;
    }
  }

  // 每个孩子可以设置同一道题最多答错几次（默认 6），之后显示正确答案
  function triesOf() {
    const c = S.session && S.config && S.config.children.find(x => x.id === S.session.child);
    return (c && c.tries) || 6;
  }

  // advance=true：点了“下一个单词”
  //   答对后的展示中、或已经显示了正确答案 → 进入下一题
  //   还没填满 → 提示先填完（不能跳过）；填满了 → 和“提交答案”一样判题，答错留在本题
  function submit(advance) {
    if (advance && S.solved && S.advTimer) { // 答对后正在展示（例句），点“下一个单词”立即继续
      clearTimeout(S.advTimer); S.advTimer = null;
      hideFeedback();
      nextWord();
      return;
    }
    if (advance && S.revealed) { hideFeedback(); nextWord(); return; }
    if (S.busy || S.cur < 0) return;
    const full = !S.filled.includes(null);
    if (!full) {
      if (advance) {
        showFeedback('bad', '✏️', '先把空填完哦');
        clearTimeout(S.hintTimer);
        S.hintTimer = setTimeout(hideFeedback, 900);
      }
      return;
    }
    const w = S.words[S.cur].en;
    const ok = S.blanks.every((pos, k) => w[pos] === S.filled[k]); // 区分大小写
    S.busy = true;
    $('submitBtn').disabled = true;
    if (!ok) S.tries++;
    recordAnswer(w, ok, !ok && S.tries > 2, !ok && S.tries > 1);
    if (ok) {
      S.correct++;
      S.solved = true;
      updateScore();
      renderWord(true);
      playSuccess();
      const word = S.words[S.cur];
      const checkedIn = S.justCheckedIn;
      S.justCheckedIn = false;
      celebrate(checkedIn);
      const advance = ms => { S.advTimer = setTimeout(() => { S.advTimer = null; hideFeedback(); nextWord(); }, ms); };
      if (!word.ex) { advance(1600 + (checkedIn ? 1000 : 0)); return; }
      // 有例句：先放完庆祝动画，再显示例句并朗读；读完停 1 秒换题（不朗读时停 2.5 秒）
      S.advTimer = setTimeout(() => {
        hideFeedback();
        document.querySelectorAll('.spark').forEach(x => x.remove());
        showExample(word);
        if (!S.autoSpeak) { advance(2500); return; }
        let done = false;
        const finish = () => {
          if (done || S.words[S.cur] !== word || !S.solved || !S.advTimer) return; // 已经按了“下一个单词”
          done = true;
          clearTimeout(S.advTimer);
          advance(1000);
        };
        // 有的设备读完不回调，按句子长度估一个最长等待时间
        S.advTimer = setTimeout(finish, Math.min(30000, 6000 + word.ex.length * 120 / speechRate())); // 保险：朗读一直不回调时也能换题
        speak(word.ex, finish);
      }, checkedIn ? 2300 : 1500);
    } else {
      S.wrong++;
      S.wrongThisWord = true;
      updateScore();
      playWrong();
      const box = $('word');
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      const left = triesOf() - S.tries;
      if (left <= 0) { revealAnswer('正确答案是这样的'); return; } // 错满次数
      // 填的字母保留，答错的标红：孩子点红色的字母清掉，再输入正确的
      S.badSlots = new Set(S.blanks.map((pos, k) => (w[pos] !== S.filled[k] ? k : -1)).filter(k => k >= 0));
      const badCount = S.badSlots.size;
      showFeedback('bad', '❌', (S.blanks.length > 2 ? '有 ' + badCount + ' 个字母不对' : '再想想～')
        + '<br><small style="font-size:.6em">点红色的字母改一改，还可以试 ' + left + ' 次</small>');
      setTimeout(() => {
        hideFeedback();
        box.classList.remove('shake');
        S.busy = false;
        if (!S.revealed) show('peekBtn', true);
        renderWord();
      }, 1100);
    }
  }

  // ---------- 答题记录：先放本地队列，再按顺序提交（失败会自动重试） ----------
  const QUEUE_KEY = 'spell_record_queue';
  let flushPromise = null, retryTimer = null;

  function submitRound(status) {
    const r = S.round;
    if (!S.online || !S.session || !r) return;
    if (!r.events.length && !r.skipped.length) return;
    if (r.events.length === r.sent && r.lastStatus === status) return; // 没有新内容
    r.seq++;
    const payload = {
      op: 'record', child: S.session.child, pin: S.session.pin,
      record: {
        id: r.id, seq: r.seq, status, group: r.group || undefined,
        start: new Date(r.start).toISOString(),
        durationSec: Math.round((r.lastActive - r.start) / 1000),
        planned: r.planned, correct: r.correct, wrong: r.wrong,
        wrongWords: r.wrongWords, skipped: r.skipped,
        events: r.events.slice(r.sent),
      },
    };
    r.sent = r.events.length;
    r.lastStatus = status;
    const q = ls.get(QUEUE_KEY, []);
    q.push(payload);
    ls.set(QUEUE_KEY, q);
    flushQueue(status === 'incomplete');
  }

  // 正在发送时再次调用，返回同一个 Promise，调用方可以等它发完
  function flushQueue(keepalive) {
    if (!flushPromise) flushPromise = doFlush(keepalive).finally(() => { flushPromise = null; });
    return flushPromise;
  }
  async function doFlush(keepalive) {
    if (S.offline) return; // 离线练习中：联网后由 tryReconnect 统一补传
    try {
      for (;;) {
        const q = ls.get(QUEUE_KEY, []);
        if (!q.length) break;
        try {
          await api('POST', '', q[0], { keepalive, timeout: 15000 });
        } catch (e) {
          if (e instanceof ApiError && e.status === 401) {
            // PIN 已被家长修改：同一孩子、同一旧 PIN 的记录都会被拒绝，一次全部移除，避免反复输错触发锁定
            console.warn('PIN 已失效，丢弃该孩子排队中的记录：', e.message);
            const bad = q[0];
            ls.set(QUEUE_KEY, ls.get(QUEUE_KEY, []).filter(x => !(x.child === bad.child && x.pin === bad.pin)));
            continue;
          } else if (e instanceof ApiError && e.status >= 400 && e.status < 500 && e.status !== 429) {
            console.warn('答题记录被拒绝，已丢弃：', e.message);
          } else {
            // 网络问题、服务器错误、或孩子 PIN 被锁定（429）：保留，稍后重试
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => flushQueue(false), 30000);
            break;
          }
        }
        const rest = ls.get(QUEUE_KEY, []);
        rest.shift();
        ls.set(QUEUE_KEY, rest);
      }
    } catch (e) {
      console.warn('补传答题记录出错：', e);
    }
  }

  // 中途离开（切到别的 App、关闭页面）时，把进度作为“未完成”先保存
  function saveProgress() {
    if (S.round && !S.round.done) submitRound('incomplete');
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });
  window.addEventListener('pagehide', saveProgress);

  // 难度按孩子保存在服务器上（家长在管理页也能改）；离线或网络不好时先记在本机，联网后再保存
  const LEVEL_PENDING = 'spell_level_pending';
  function setLevel(id) {
    S.level = id;
    const c = myChild();
    if (c) {
      c.level = id;
      ls.set(LEVEL_PENDING, { child: c.id, level: id });
      syncLevel();
    } else ls.set('spell_level', id); // 没有选孩子（离线模式）：记在本机
    updateLevelChip();
    renderLevelBar();
  }
  async function syncLevel() {
    const p = ls.get(LEVEL_PENDING, null);
    if (!p || !S.session || p.child !== S.session.child || S.offline || !S.online) return;
    try {
      await api('POST', '', { op: 'level', child: p.child, pin: S.session.pin, level: p.level });
      const now = ls.get(LEVEL_PENDING, null);
      if (now && now.child === p.child && now.level === p.level) ls.del(LEVEL_PENDING);
    } catch (e) {
      if (e instanceof ApiError && e.status !== 429) ls.del(LEVEL_PENDING); // 被拒绝（比如 PIN 已改）：不再重试
    }
  }
  // 读到孩子的设置后，用这个孩子的难度（本机还没保存到服务器的优先）
  function applyChildLevel() {
    const c = myChild();
    if (!c) return;
    const p = ls.get(LEVEL_PENDING, null);
    if (p && p.child === c.id) { S.level = p.level; c.level = p.level; syncLevel(); }
    else S.level = c.level || 'auto';
  }

      });

  // 今日复习 / 错词本：从孩子选的单词分组里挑词（同一个英文在分组里只取第一次出现的释义）
  function reviewWords(g = curGroup()) {
    const today = WordLib.bjDate();
    return poolOf(g).filter(w => WordLib.isDue(S.stats[w.en], today))
      .sort((a, b) => (S.stats[a.en].due < S.stats[b.en].due ? -1 : S.stats[a.en].due > S.stats[b.en].due ? 1 : 0));
  }
  function wrongWords(g = curGroup()) {
    return poolOf(g).filter(w => ((S.stats[w.en] || {}).score || 0) > 0)
      .sort((a, b) => S.stats[b.en].score - S.stats[a.en].score);
  }

  function myLists() {
    const c = S.session && S.config && S.config.children.find(x => x.id === S.session.child);
    const allowed = c && Array.isArray(c.groups) ? c.groups : null; // 家长分配的单词表组，null 表示全部
    return allowed ? S.config.lists.filter(l => allowed.includes(l.group || '其他')) : S.config.lists;
  }

  // ---------- 离线使用（T1） ----------
  // 每次在线进入选单词表界面时，把配置、这个孩子能练的单词表和熟练度存到本机（localStorage）；
  // 连不上服务器时用这份数据照常练习，答题记录排队，联网后自动上传
  const OFF_KEY = child => 'spell_offline_' + child;
  S.offline = false;
  S.texts = {}; // 单词表编号 → 内容（离线时从本机数据取）
  function saveOffline(cfg, all, st) {
    const mine = new Set(myLists().map(l => l.id));
    const lists = {};
    all.lists.filter(l => mine.has(l.id)).forEach(l => { lists[l.id] = l.text; });
    ls.set(OFF_KEY(S.session.child), { config: cfg, lists, stats: { words: (st && st.words) || {}, days: (st && st.days) || {} }, savedAt: new Date().toISOString() });
  }
  const loadOffline = child => { const d = ls.get(OFF_KEY(child), null); return d && d.config && d.lists ? d : null; };
  // 连不上服务器（不是密码、参数这类错误），而且本机有数据时，切换到离线练习
  const canGoOffline = e => !(e instanceof ApiError) && S.session && !!loadOffline(S.session.child);
  let reconnectTimer = null;
  function goOffline() {
    S.offline = true;
    show('offlineBar', true);
    document.body.classList.add('is-offline');
    clearInterval(reconnectTimer);
    reconnectTimer = setInterval(tryReconnect, 20000);
  }
  let reconnecting = false;
  async function tryReconnect() {
    if (!S.offline || reconnecting) return;
    reconnecting = true;
    try {
      const cfg = await api('GET', '?op=config', null, { timeout: 5000 });
      S.offline = false;
      clearInterval(reconnectTimer);
      show('offlineBar', false);
      document.body.classList.remove('is-offline');
      S.config = cfg;
      await flushQueue(false); // 补传离线时的答题记录
      syncLevel();
      // 刷新本机数据，下次离线时也是最新的
      const [all, st] = await Promise.all([api('GET', '?op=alltext'), api('GET', '?op=stats&child=' + encodeURIComponent(S.session.child))]);
      saveOffline(cfg, all, st);
    } catch (e) { /* 还是连不上：下次再试 */ } finally { reconnecting = false; }
  }
  window.addEventListener('online', () => setTimeout(tryReconnect, 1000));
  // 还没发出去的记录（比如网络不好、离线练习）：在服务器数据上补算，保证进度、复习和错词不会“倒退”
  function replayQueue(stats, days) {
    ls.get(QUEUE_KEY, []).filter(x => x.child === S.session.child).forEach(x => (x.record.events || []).forEach(ev => {
      WordLib.applyAnswer(stats[ev.en] || (stats[ev.en] = { score: 0, wrong: 0, right: 0 }), ev.ok, ev.at, !!ev.ns, !!ev.rp);
      if (days && ev.ok) { const d = WordLib.bjDate(ev.at); days[d] = (days[d] || 0) + 1; }
    }));
  }

  async function loadPoolAndStats() {
    let cfg, all, st;
    if (!S.offline) {
      try {
        await flushQueue(false); // 先把刚才离开的那一轮发出去，服务器的数据才是最新的
        [cfg, all, st] = await Promise.all([
          api('GET', '?op=config'),
          api('GET', '?op=alltext'),
          api('GET', '?op=stats&child=' + encodeURIComponent(S.session.child)),
        ]);
        S.config = cfg;
        saveOffline(cfg, all, st);
      } catch (e) {
        if (!canGoOffline(e)) throw e;
        goOffline();
      }
    }
    if (S.offline) {
      const d = loadOffline(S.session.child);
      cfg = d.config;
      all = { lists: Object.entries(d.lists).map(([id, text]) => ({ id, text })) };
      st = JSON.parse(JSON.stringify(d.stats));
    }
    S.config = cfg;
    S.texts = {};
    all.lists.forEach(l => { S.texts[l.id] = l.text; });
    const seen = new Set();
    S.pool = [];
    // 今日复习 / 错词本只从这个孩子能用的单词表里挑词
    // 按管理页的顺序（先分组，再组里的单词表，再表里每行）：学新词按这个顺序出词
    orderedMyLists().forEach(l => WordLib.parse(S.texts[l.id] || '').forEach(w => { if (!seen.has(w.en)) { seen.add(w.en); S.pool.push(w); } }));
    // 每个单词分组自己的词池：今日复习、学新词、错词本按分组分开练（熟练度还是按单词记，几个分组共用）
    S.groupPools = {};
    listGroups().forEach(g => {
      const inGroup = new Set(), words = S.groupPools[g] = [];
      myLists().filter(l => groupName(l) === g).forEach(l => WordLib.parse(S.texts[l.id] || '').forEach(w => { if (!inGroup.has(w.en)) { inGroup.add(w.en); words.push(w); } }));
    });
    S.stats = (st && st.words) || {};
    S.days = (st && st.days) || {};
    replayQueue(S.stats, S.days);
    applyChildLevel();
  }

    overlay('badgeOverlay', true);
  }

  // 分组：“其他”放在最后；只有一个分组时不显示分组按钮
  const groupName = l => l.group || '其他';
  function listGroups() {
    const gs = [];
    myLists().forEach(l => { const g = groupName(l); if (!gs.includes(g)) gs.push(g); });
    return gs.filter(g => g !== '其他').concat(gs.includes('其他') ? ['其他'] : []);
  }
  // 孩子能练的单词表，按管理页的顺序：分组顺序（“其他”最后），组里按单词表顺序
  const orderedMyLists = () => listGroups().flatMap(g => myLists().filter(l => groupName(l) === g));

  // 孩子选的单词分组：按孩子记在这台设备上；第一次（或那个分组不能练了）用管理页里排第一的分组
  const groupKeyLS = () => 'spell_group_' + (S.session ? S.session.child : '');
  function curGroup() {
    const gs = listGroups(), g = ls.get(groupKeyLS(), null);
    return gs.includes(g) ? g : (gs[0] || '');
  }
  const poolOf = g => (S.groupPools && S.groupPools[g]) || S.pool;
  function setGroup(g) {
    ls.set(groupKeyLS(), g);
    $('pickMsg').textContent = ''; // 上一个分组的提示（比如“复习都完成啦”）不再显示
    renderListCards();
    renderReviewBanner();
  }
  // 今天一共要复习几个词（几个分组里都有的词只算一次）；有好几个分组时，后面写上每个分组各几个
  function renderReviewBanner() {
    const today = WordLib.bjDate(), gs = listGroups();
    const total = S.pool.filter(w => WordLib.isDue(S.stats[w.en], today)).length;
    const each = gs.length > 1 ? gs.map(g => [g, reviewWords(g).length]).filter(x => x[1]) : [];
    $('reviewBanner').textContent = '📅 今天有 ' + total + ' 个单词该复习了' + (each.length ? '（' + each.map(x => x[0] + ' ' + x[1]).join(' · ') + '）' : '');
    show('reviewBanner', total > 0);
  }

  const PICK_TITLE = '今天练什么？';
  // 选表页：有好几个单词分组时，上面先选分组；下面是这个分组的三个答题入口（今日复习、学新词、错词本）和学单词（点进去只看不考）
  function renderListCards() {
    const gs = listGroups(), g = curGroup();
    const due = reviewWords(g).length, wrong = wrongWords(g).length;
    const plan = newPlan(g);
    const msg = $('pickMsg').textContent, msgCls = $('pickMsg').className;
    const nLists = myLists().filter(l => groupName(l) === g).length;
    renderCards(PICK_TITLE, (gs.length > 1 ? [{ pills: gs.map(x => ({ name: x, on: x === g, badge: reviewWords(x).length, onClick: () => setGroup(x) })) }] : []).concat([
      { icon: '📅', name: '今日复习', sub: due ? due + ' 个单词' : '今天没有要复习的', cls: 'review', disabled: !due, onClick: () => startVirtual('review') },
      { icon: '✨', name: '学新词', sub: NEW_STATUS[plan.status](plan.quota), cls: 'new', disabled: plan.status !== 'ready', onClick: () => startVirtual('new') },
      { icon: '📕', name: '错词本', sub: wrong ? wrong + ' 个错词' : '暂无错词', cls: 'wrong', disabled: !wrong, onClick: () => startVirtual('wrong') },
    ], g ? [{ heading: '📖 学单词（看一看、听一听，不用答题）' },
      { icon: '📘', name: g, sub: nLists + ' 个单词表 · ' + poolOf(g).length + ' 个词', cls: 'study', onClick: () => showStudy(g) }] : []));
    $('pickMsg').textContent = msg; $('pickMsg').className = msgCls; // 保留提示
    show('adminLink', true); // 选表页面也有管理员入口
  }

  // ---------- 学习页面（离线也能用，数据来自选表时读到的单词表） ----------
  // 两种用法：① 单词组（学单词）：只看不考，不记录，有单元按钮；② 今日复习、学新词、错词本：看完点“开始答题”
  const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const study = { group: '', virtual: null, lists: [], list: null, words: [], mode: 'list', idx: 0, flipped: false, cnFirst: false };
  const studyKey = () => 'spell_study_' + (S.session ? S.session.child : '') + '_' + (study.virtual ? '~答题' : study.group);
  const shortName = (l, g) => (l.name.startsWith(g + ' ') ? l.name.slice(g.length + 1) : l.name);
  function showStudy(g) {
    study.group = g; study.virtual = null;
    study.lists = myLists().filter(l => groupName(l) === g);
    if (!study.lists.length) return;
    // 默认打开上次看的单元；第一次打开这个分组时，打开“学新词”接下来要学的那个单元
    const saved = ls.get(studyKey(), null) || {};
    let list = study.lists.find(l => l.id === saved.list);
    if (!list) {
      const next = poolOf(g).find(w => WordLib.isNewWord(S.stats[w.en]));
      list = (next && study.lists.find(l => WordLib.parse(S.texts[l.id] || '').some(w => w.en === next.en))) || study.lists[0];
    }
    study.mode = saved.mode === 'card' ? 'card' : 'list';
    study.cnFirst = !!saved.cnFirst;
    $('studyTitle').textContent = g;
    const bar = $('unitBar');
    bar.innerHTML = '';
    study.lists.forEach(l => {
      const b = document.createElement('button');
      b.textContent = shortName(l, g);
      b.dataset.id = l.id;
      b.addEventListener('click', () => openStudyList(l));
      bar.appendChild(b);
    });
    show('unitBar', study.lists.length > 1);
    show('studyStartBox', false);
    show('adminLink', false);
    showView('study');
    openStudyList(list);
  }
  // 今日复习、学新词、错词本：先在学习页面看一遍这一轮的单词，再点“开始答题”
  function showStudyVirtual(v) {
    study.virtual = v.id; study.group = ''; study.list = null;
    const saved = ls.get(studyKey(), null) || {};
    study.mode = saved.mode === 'card' ? 'card' : 'list';
    study.cnFirst = !!saved.cnFirst;
    $('studyTitle').textContent = v.icon + ' ' + v.name;
    $('studySub').textContent = (listGroups().length > 1 && S.list.group ? S.list.group + ' · ' : '') + S.words.length + ' 个单词 · ' + v.sub;
    show('unitBar', false);
    show('studyStartBox', true);
    show('adminLink', false);
    showView('study');
    fillStudy(S.words);
  }
  function saveStudy() { ls.set(studyKey(), { list: study.list && study.list.id, mode: study.mode, cnFirst: study.cnFirst }); }
  function openStudyList(l) {
    study.list = l;
    [...$('unitBar').children].forEach(b => b.classList.toggle('on', b.dataset.id === l.id));
    const words = WordLib.parse(S.texts[l.id] || '');
    $('studySub').textContent = words.length + ' 个单词 · 看一看、听一听，不用答题';
    fillStudy(words);
  }
  function fillStudy(words) {
    stopReadAll();
    study.words = words;
    study.idx = 0; study.flipped = false;
    const ul = $('studyWords');
    ul.innerHTML = '';
    words.forEach(w => ul.appendChild(studyRow(w)));
    if (!words.length) ul.innerHTML = '<li>这个单词表还没有保存到这台设备上，联网后再试</li>';
    prefetchClips(words);
    setStudyMode(study.mode);
    window.scrollTo(0, 0);
  }
  function setStudyMode(m) {
    stopReadAll();
    study.mode = m;
    [...$('studyModes').children].forEach(b => b.classList.toggle('on', b.dataset.m === m));
    show('studyListBox', m === 'list');
    show('studyCardBox', m === 'card');
    show('readAllBtn', m === 'list'); // 连续朗读只在列表模式
    if (m === 'card') renderFlash(true);
    saveStudy();
  }
  // 列表的一行：🔊、英文、词性和中文、例句和翻译、掌握情况
  function studyRow(w) {
    const li = document.createElement('li');
    const [cls, label] = wordStatus(w);
    li.innerHTML = '<button class="spk" aria-label="朗读">' + SPK_SVG + '</button>'
      + '<div><div class="sline"><span class="sen">' + esc(w.en) + '</span><span class="scn">' + (w.pos ? esc(w.pos) + ' ' : '') + esc(w.cn)
      + (w.note ? ' <small>' + esc(w.note) + '</small>' : '') + '</span></div>'
      + (w.ex ? '<div class="sex">' + esc(w.ex) + (w.exCn ? '<span>' + esc(w.exCn) + '</span>' : '') + '</div>' : '') + '</div>'
      + '<span class="pill ' + cls + '">' + label + '</span>';
    li.querySelector('.spk').addEventListener('click', e => { e.stopPropagation(); pauseReadAll(); speakWord(w); });
    li.addEventListener('click', () => { if (reader.state === 'pause') playReadAll([...li.parentNode.children].indexOf(li)); });
    return li;
  }
  // 翻卡片：正面先看英文（或先看中文），点卡片左右翻面；dir 是换卡片时新卡片滑进来的方向（1 从右边，-1 从左边）
  function renderFlash(speakIt, dir) {
    const w = study.words[study.idx];
    const box = $('flash');
    $('fcSide').textContent = study.cnFirst ? '先看英文' : '先看中文';
    study.flipped = false;
    box.classList.remove('flipped');
    if (!w) { box.innerHTML = '<div class="fc-in"><div class="fc-face plain"><div class="hint">没有单词</div></div></div>'; return; }
    const count = '<div class="count">' + (study.idx + 1) + ' / ' + study.words.length + '</div>';
    const cn = '<div class="cnbig">' + (w.pos ? '<small>' + esc(w.pos) + '</small> ' : '') + esc(w.cn) + '</div>';
    const en = '<div class="big">' + esc(w.en) + '</div>';
    const ex = w.ex ? '<div class="ex">' + esc(w.ex) + (w.exCn ? '<span>' + esc(w.exCn) + '</span>' : '') + '</div>' : '';
    const say = '<button class="spk" aria-label="朗读">' + SPK_SVG + '</button>';
    const front = study.cnFirst ? cn + '<div class="hint">想一想英文怎么拼，点一下翻面</div>' : en + say + '<div class="hint">想一想是什么意思，点一下翻面</div>';
    box.innerHTML = '<div class="fc-in"><div class="fc-face front">' + count + front + '</div><div class="fc-face back">' + count + en + cn + say + ex + '</div></div>';
    box.querySelectorAll('.spk').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); speakWord(w); }));
    if (dir) { box.classList.remove('in-l', 'in-r'); void box.offsetWidth; box.classList.add(dir > 0 ? 'in-r' : 'in-l'); }
    if (speakIt && !study.cnFirst) speakWord(w);
  }
  // 翻面：翻到背面时读一遍
  function flipFlash() {
    const w = study.words[study.idx];
    if (!w) return;
    study.flipped = !study.flipped;
    $('flash').classList.toggle('flipped', study.flipped);
    if (study.flipped) speakWord(w);
  }
  function flashGo(step) {
    if (!study.words.length) return;
    study.idx = (study.idx + step + study.words.length) % study.words.length;
    renderFlash(true, step);
  }
  // 连续朗读：一个接一个读单词和例句，当前这一行高亮。
  // 按钮：▶ 连续朗读 → ⏸ 暂停 → ▶ 继续（从停下的那个单词重新读）；⏹ 完全停止，下次从头读
  const reader = { state: '', idx: 0, token: 0 };   // state：'' 没在读，'play' 在读，'pause' 暂停
  function setReader(state) {
    reader.state = state;
    const b = $('readAllBtn');
    b.textContent = state === 'play' ? '⏸ 暂停' : state === 'pause' ? '▶ 继续' : '▶ 连续朗读';
    b.classList.toggle('playing', state === 'play');
    b.classList.toggle('paused', state === 'pause');
    show('readStopBtn', !!state);
  }
  const markRow = i => [...$('studyWords').children].forEach((li, k) => li.classList.toggle('reading', k === i));
  // 完全停止（点 ⏹、换单元、换模式、离开页面）
  function stopReadAll() {
    if (!reader.state) return;
    reader.token = 0;
    stopSpeak();
    markRow(-1);
    setReader('');
  }
  // 暂停：停在当前这一行，保持高亮
  function pauseReadAll() {
    if (reader.state !== 'play') return;
    reader.token = 0;
    stopSpeak();
    setReader('pause');
  }
  function playReadAll(from) {
    const token = reader.token = Date.now();
    setReader('play');
    const rows = [...$('studyWords').children];
    const alive = () => reader.token === token;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const say = f => new Promise(r => f(r)); // speak 保证会回调（读完、出错、超时或被打断）
    (async () => {
      for (let i = from; i < study.words.length && alive(); i++) {
        reader.idx = i;
        const w = study.words[i];
        markRow(i);
        if (rows[i]) rows[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
        const t0 = Date.now();
        await say(r => speakWord(w, r));
        if (!alive()) return;
        if (w.ex) { await wait(400); if (!alive()) return; await say(r => speak(w.ex, r)); }
        await wait(Math.max(700, 1200 - (Date.now() - t0)));
      }
      if (alive()) stopReadAll();
    })();
  }
  function readAll() {
    if (reader.state === 'play') pauseReadAll();
    else playReadAll(reader.state === 'pause' ? reader.idx : 0);
  }


  // ---------- PIN ----------
  let pinChild = null, pinValue = '';
  function askPin(child) {
    pinChild = child; pinValue = '';
    $('pinTitle').textContent = child.name + '，请输入 PIN';
    $('pinMsg').textContent = '';
    renderPinDots();
    overlay('pinOverlay', true);
  }
  function renderPinDots() {
    [...$('pinDots').children].forEach((d, i) => d.classList.toggle('on', i < pinValue.length));
  }
  function buildPinpad() {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '取消', '0', '⌫'];
    keys.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      if (k === '取消' || k === '⌫') b.className = 'fn';
      b.addEventListener('click', () => pinKey(k));
      $('pinpad').appendChild(b);
    });
  }
  async function pinKey(k) {
    if (k === '取消') {
      overlay('pinOverlay', false);
      showChildPicker();
      return;
    }
    if (k === '⌫') { pinValue = pinValue.slice(0, -1); renderPinDots(); return; }
    if (pinValue.length >= 4) return;
    pinValue += k;
    renderPinDots();
    if (pinValue.length < 4) return;
    $('pinMsg').textContent = '';
    try {
      await api('POST', '', { op: 'pin', child: pinChild.id, pin: pinValue });
      S.session = { child: pinChild.id, pin: pinValue, name: pinChild.name };
      ls.set('spell_session', S.session);
      overlay('pinOverlay', false);
      flushQueue(false);
      showListPicker();
    } catch (e) {
      $('pinMsg').textContent = e instanceof ApiError ? e.message : '连接失败：' + e.message;
      const dots = $('pinDots');
      dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
      pinValue = '';
      setTimeout(renderPinDots, 300);
    }
  }

  // ---------- 开始答题 ----------
  // 今日复习 / 错词本（虚拟单词表，每轮最多取孩子的“每轮题数”个，按优先顺序取）
  const VIRTUAL = {
    review: { id: 'x_review', icon: '📅', name: '今日复习', pick: g => reviewWords(g), sub: '这些单词今天该复习了' },
    new: { id: 'x_new', icon: '✨', name: '学新词', pick: g => newPlan(g).words, sub: '先看一遍新词的意思，听听读音，再开始答题' },
    wrong: { id: 'x_wrong', icon: '📕', name: '错词本', pick: g => wrongWords(g), sub: '这些单词最近容易错，多练几遍' },
  };
  const NEW_EMPTY = { 'review-first': '先完成今日复习，再学新词', 'today-done': '🎉 今天的新词学完啦！', 'review-only': '今天复习已经够量了，明天再学新词', 'all-done': '🎉 这组的新词都学完啦！', paused: '学新词已暂停' };
  // direct：本轮结束后点“再来一轮”时直接开始，不再显示列表；g：单词分组（默认孩子选的分组）
  function startVirtual(kind, direct, g = curGroup()) {
    const v = VIRTUAL[kind];
    const words = v.pick(g).slice(0, roundOf());
    if (!words.length) {
      if (kind === 'new') { const st = newPlan(g).status; showListPicker(NEW_EMPTY[st] || '', st === 'today-done' || st === 'all-done'); return; }
      showListPicker(kind === 'review' ? '🎉 今天的复习都完成啦！' : '🎉 错词都练好啦！', true);
      return;
    }
    // 有好几个分组时，名字后面写上分组（右上角的“换单词表”按钮、答题记录、报表都用这个）
    S.list = { id: v.id, name: v.name + (listGroups().length > 1 && g ? ' · ' + g : ''), virtual: kind, group: g };
    S.words = words;
    updateChips();
    if (direct) { showView('game'); startRound(); return; }
    showStudyVirtual(v);
  }

  // 单词的掌握情况（学习页面每一行右边的标签）
  function wordStatus(w) {
    const st = S.stats[w.en];
    if (!st || !((st.right || 0) + (st.wrong || 0))) return ['n', '还没练过'];
    if (st.mastered) return ['m', '已掌握'];
    if (WordLib.isDue(st)) return ['d', '今天该复习'];
    if ((st.score || 0) > 0) return ['w', '容易错'];
    return ['o', '练过'];
  }

  const beginPractice = () => { showView('game'); startRound(); };

  // 离线（本地打开或服务出错）：只用 words.js，不记录成绩
  function startOffline(text) {
    const words = WordLib.parse(text || '');
    if (!words.length) { overlay('loadOverlay', true); return; }
    overlay('loadOverlay', false);
    S.online = false;
    S.list = { id: 'local', name: '默认词库' };
    S.words = words; S.stats = S.stats || {};
    show('offlineNote', true);
    updateChips();
    showView('game');
    startRound();
  }

  // ---------- 键盘 ----------
  const ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  function buildKeyboard() {
    const kb = $('keyboard');
    ROWS.forEach((row, r) => {
      const div = document.createElement('div');
      div.className = 'krow';
      if (r === 2) div.appendChild(makeKey('⇧', 'wide shift', () => setShift(!S.shift)));
      [...row].forEach(c => {
        const k = makeKey(c, 'letter', () => typeLetter(S.shift ? c.toUpperCase() : c));
        k.dataset.c = c;
        div.appendChild(k);
      });
      if (r === 2) div.appendChild(makeKey('⌫', 'wide', backspace));
      kb.appendChild(div);
    });
  }
  function makeKey(label, cls, fn) {
    const b = document.createElement('button');
    b.className = 'key ' + cls;
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }
  function setShift(on) {
    S.shift = on;
    document.querySelectorAll('.key.letter').forEach(k => {
      k.textContent = on ? k.dataset.c.toUpperCase() : k.dataset.c;
    });
    const sk = document.querySelector('.key.shift');
    if (sk) sk.classList.toggle('on', on);
  }

  // 电脑实体键盘
  const isShown = id => $(id).classList.contains('show');
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (isShown('pinOverlay')) {
      if (/^\d$/.test(e.key)) pinKey(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); pinKey('⌫'); }
      return;
    }
    if (isShown('roundOverlay')) {
      if (e.key === 'Enter') { e.preventDefault(); $('newRoundBtn').click(); }
      return;
    }
    if (!$('studyView').hidden) { // 学单词：翻卡片时 ← → 切换，空格或回车翻面
      if (study.mode !== 'card') { if (e.key === 'Enter' && study.virtual) { e.preventDefault(); beginPractice(); } return; }
      if (e.key === 'ArrowLeft') flashGo(-1);
      else if (e.key === 'ArrowRight') flashGo(1);
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipFlash(); }
      return;
    }
    if ($('gameView').hidden || isShown('loadOverlay') || isShown('loadingOverlay')) return;
    if (isLetter(e.key)) {
      typeLetter(e.key);
      const k = document.querySelector('.key.letter[data-c="' + e.key.toLowerCase() + '"]');
      if (k) { k.classList.add('pressed'); setTimeout(() => k.classList.remove('pressed'), 120); }
    } else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
    else if (e.key === 'Enter') { e.preventDefault(); submit(S.revealed); }
  });

  // ---------- 按钮 ----------
  $('submitBtn').addEventListener('click', () => submit(false));
  // 答错过以后才出现：直接看正确答案（这道题已经记为答错，不再额外扣分）
  $('peekBtn').addEventListener('click', () => {
    if (S.busy || S.cur < 0 || S.solved || S.revealed || !S.tries) return;
    revealAnswer('答案在这里');
  });
  $('resetBtn').addEventListener('click', resetWord);
  $('nextBtn').addEventListener('click', () => submit(true));
  $('speakBtn').addEventListener('click', () => { if (S.cur >= 0) speakWord(S.words[S.cur]); });
  $('newRoundBtn').addEventListener('click', () => {
    if (S.list && S.list.virtual) { overlay('roundOverlay', false); startVirtual(S.list.virtual, true, S.list.group); }
    else startRound();
  });
  $('checkinBar').addEventListener('click', showBadges);
  $('studyStart').addEventListener('click', beginPractice);
  $('studyBack').addEventListener('click', () => { stopReadAll(); showListPicker(); });
  $('studyModes').addEventListener('click', e => { const m = e.target.dataset && e.target.dataset.m; if (m) setStudyMode(m); });
  $('readAllBtn').addEventListener('click', readAll);
  $('readStopBtn').addEventListener('click', stopReadAll);
  $('rateChip').addEventListener('click', () => { cycleRate(); if (S.cur >= 0) speakWord(S.words[S.cur]); });
  $('studyRate').addEventListener('click', () => { cycleRate(); if (study.mode === 'card' && study.words[study.idx]) speakWord(study.words[study.idx]); });
  // 锁屏或切到别的 App 时，连续朗读自动暂停
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pauseReadAll(); });
  $('flash').addEventListener('click', flipFlash);
  $('fcPrev').addEventListener('click', () => flashGo(-1));
  $('fcNext').addEventListener('click', () => flashGo(1));
  $('fcSide').addEventListener('click', () => { study.cnFirst = !study.cnFirst; saveStudy(); renderFlash(true); });
  $('retryBtn').addEventListener('click', () => showListPicker());
  $('badgeClose').addEventListener('click', () => overlay('badgeOverlay', false));
  $('speakChip').addEventListener('click', () => {
    S.autoSpeak = !S.autoSpeak;
    ls.set('spell_autospeak', S.autoSpeak);
    updateSpeakChip();
    if (S.autoSpeak && S.cur >= 0) speakWord(S.words[S.cur]);
  });
  $('levelChip').addEventListener('click', () => {
    const i = LEVELS.findIndex(l => l[0] === S.level);
    setLevel(LEVELS[(i + 1) % LEVELS.length][0]); // 从下一题开始生效
  });
  $('changeListBtn').addEventListener('click', () => { overlay('roundOverlay', false); showListPicker(); });
  $('listChip').addEventListener('click', () => {
    if (!S.online || !S.list || S.busy) return;
    saveProgress();
    S.round = null;
    overlay('roundOverlay', false);
    showListPicker();
  });
  $('childChip').addEventListener('click', () => {
    if (!S.online || !S.session || S.busy) return;
    if (S.offline) {
      showFeedback('bad', '📴', '离线时不能换小朋友<br><small style="font-size:.6em">联网后再试</small>');
      setTimeout(hideFeedback, 1600);
      return;
    }
    if (!confirm('要换成其他小朋友吗？')) return;
    saveProgress();
    S.round = null;
    S.session = null;
    ls.del('spell_session');
    overlay('roundOverlay', false);
    showChildPicker();
  });
  $('pickBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let text = String(r.result);
      const m = /\.js$/i.test(f.name) && text.match(/WORDS\s*=\s*`([\s\S]*)`/); // words.js：取反引号之间的内容
      if (m) text = m[1];
      if (!WordLib.parse(text).length) $('loadErr').textContent = '这个文件里没有找到可用的单词，请检查格式。';
      else startOffline(text);
    };
    r.readAsText(f, 'utf-8');
    e.target.value = '';
  });

  // ---------- 启动 ----------
  async function init() {
    buildKeyboard();
    updateSpeakChip();
    buildPinpad();
    overlay('loadingOverlay', true);
    // 本机记住的孩子如果有离线数据，连不上服务器时可以直接离线练习（等待时间也短一些）
    const savedSession = ls.get('spell_session', null);
    const cached = savedSession && loadOffline(savedSession.child);
    try {
      S.config = await api('GET', '?op=config', null, cached ? { timeout: 6000 } : {});
      S.online = true;
    } catch (e) {
      const child = cached && !(e instanceof ApiError) && cached.config.children.find(c => c.id === savedSession.child);
      overlay('loadingOverlay', false);
      if (child) {
        S.online = true;
        S.config = cached.config;
        S.session = { child: child.id, pin: savedSession.pin, name: child.name };
        goOffline();
        showListPicker();
        return;
      }
      startOffline(typeof WORDS === 'string' ? WORDS : '');
      return;
    }
    // 本机记住的孩子：先确认 PIN 仍然有效，再补传排队的记录
    const saved = ls.get('spell_session', null);
    const child = saved && S.config.children.find(c => c.id === saved.child);
    if (child) {
      try {
        await api('POST', '', { op: 'pin', child: child.id, pin: saved.pin });
        S.session = { child: child.id, pin: saved.pin, name: child.name };
        ls.set('spell_session', S.session);
      } catch (e) {
        if (e instanceof ApiError) ls.del('spell_session');
        // PIN 已被修改：这个旧 PIN 下排队的记录一定会被拒绝，直接丢弃，不再发送（避免多算输错次数）
        if (e instanceof ApiError && e.status === 401) {
          ls.set(QUEUE_KEY, ls.get(QUEUE_KEY, []).filter(x => !(x.child === saved.child && x.pin === saved.pin)));
        }
      }
    }
    flushQueue(false);
    overlay('loadingOverlay', false);
    if (S.session) showListPicker();
    else showChildPicker();
  }

  // 离线缓存网页文件（sw.js）；只在 https 或本机测试时可用
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  init();
})();
</script>
</body>
</html>
